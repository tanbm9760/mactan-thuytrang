<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Mạc Tân & Thuỳ Trang - Thiệp mời cưới</title>
    <meta name="description" content="Trân trọng kính mời bạn đến chung vui trong ngày hạnh phúc của chúng mình." />

    <!-- Không cho Google lập chỉ mục: ai có link vẫn mở bình thường, nhưng
         tìm tên hai bạn trên Google sẽ không ra thiệp cưới.
         (robots.txt vô dụng ở đây vì GitHub Pages phục vụ trang ở đường dẫn
         con, mà robots.txt chỉ có hiệu lực khi nằm ở gốc tên miền.) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Ảnh & tiêu đề khi share link qua Zalo / Facebook / Messenger.
         Bắt buộc dùng đường dẫn tuyệt đối - Zalo và Facebook không hiểu
         đường dẫn tương đối khi lấy ảnh xem trước. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tanbm9760.github.io/mactan-thuytrang/" />
    <meta property="og:title" content="Mạc Tân & Thuỳ Trang - Chúng mình sắp kết hôn!" />
    <meta property="og:description" content="Trân trọng kính mời bạn đến chung vui trong ngày hạnh phúc của chúng mình." />
    <meta property="og:image" content="https://tanbm9760.github.io/mactan-thuytrang/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Màu giấy đặt thẳng ở đây, trước cả tệp CSS: nếu không, khách thấy
         một nhịp trắng loé lên rồi mới tới nền ngà. Cùng màu đó dùng cho
         thanh trình duyệt trên di động. -->
    <meta name="theme-color" content="#f5f0e4" />
    <style>
      html { background: #f5f0e4; }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..600;1,300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
